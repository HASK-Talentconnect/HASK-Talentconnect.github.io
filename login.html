<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login / Sign Up - HASK TalentConnect</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .auth-wrap {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px 15px;
            background: #f5f7fa;
        }

        .auth-card {
            background: white;
            border-radius: 12px;
            padding: 35px 30px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.1);
        }

        .auth-logo {
            text-align: center;
            font-size: 1.5rem;
            font-weight: bold;
            color: #1a2a6c;
            margin-bottom: 5px;
        }

        .auth-sub {
            text-align: center;
            color: #888;
            font-size: 0.88rem;
            margin-bottom: 22px;
        }

        .tabs {
            display: flex;
            background: #f0f2f8;
            border-radius: 50px;
            padding: 4px;
            margin-bottom: 22px;
        }

        .tab-btn {
            flex: 1;
            background: transparent;
            border: none;
            color: #666;
            padding: 10px;
            cursor: pointer;
            border-radius: 50px;
            font-weight: 600;
            font-size: 0.9rem;
            transition: 0.2s;
            font-family: inherit;
        }

        .tab-btn.active {
            background: #1a2a6c;
            color: white;
        }

        .form-group { margin-bottom: 14px; }

        .form-group label {
            display: block;
            font-size: 0.85rem;
            margin-bottom: 5px;
            color: #444;
            font-weight: 500;
        }

        .input-wrap { position: relative; }

        .form-group input,
        .form-group select {
            width: 100%;
            padding: 12px 42px 12px 14px;
            border: 1.5px solid #dfe3ec;
            background: #fafbfc;
            border-radius: 8px;
            color: #222;
            font-size: 0.92rem;
            outline: none;
            transition: 0.2s;
            font-family: inherit;
        }

        .form-group input::placeholder { color: #aaa; }

        .form-group input:focus {
            border-color: #1a2a6c;
            background: white;
        }

        .toggle-pw {
            position: absolute;
            right: 10px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            cursor: pointer;
            font-size: 1rem;
            padding: 4px;
            color: #888;
        }

        .role-selector {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-top: 5px;
        }

        .role-option {
            background: #fafbfc;
            border: 2px solid #dfe3ec;
            border-radius: 8px;
            padding: 10px 6px;
            text-align: center;
            cursor: pointer;
            transition: 0.2s;
        }

        .role-option:hover { border-color: #1a2a6c; }

        .role-option.selected {
            border-color: #1a2a6c;
            background: #eef1f8;
        }

        .role-option .icon {
            font-size: 1.3rem;
            display: block;
            margin-bottom: 3px;
        }

        .role-option span {
            font-size: 0.8rem;
            font-weight: 600;
            color: #333;
        }

        .btn-submit {
            width: 100%;
            padding: 13px;
            background: #1a2a6c;
            border: none;
            border-radius: 8px;
            color: white;
            font-weight: bold;
            font-size: 0.95rem;
            cursor: pointer;
            transition: 0.2s;
            margin-top: 6px;
            font-family: inherit;
        }

        .btn-submit:hover { background: #29b6f6; }

        .btn-submit:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .forgot-link {
            display: block;
            text-align: right;
            color: #29b6f6;
            font-size: 0.8rem;
            text-decoration: none;
            margin-top: -6px;
            margin-bottom: 10px;
            font-weight: 500;
        }

        .forgot-link:hover { text-decoration: underline; }

        .auth-footer {
            text-align: center;
            margin-top: 18px;
            font-size: 0.85rem;
            color: #666;
        }

        .auth-footer a {
            color: #1a2a6c;
            font-weight: 600;
        }

        .form-section { display: none; }
        .form-section.active { display: block; }

        .code-input {
            text-align: center;
            font-size: 1.6rem;
            letter-spacing: 8px;
            font-family: monospace;
            font-weight: bold;
            padding: 12px !important;
        }

        .info-banner {
            background: #e8f4fd;
            color: #0277bd;
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 0.82rem;
            margin-bottom: 14px;
            text-align: center;
        }

        .back-home {
            position: absolute;
            top: 20px;
            left: 20px;
            color: #1a2a6c;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.88rem;
            background: white;
            padding: 8px 16px;
            border-radius: 25px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        .back-home:hover { background: #f0f2f8; }

        @media (max-width: 500px) {
            .auth-card { padding: 25px 20px; }
            .back-home { top: 12px; left: 12px; padding: 6px 12px; font-size: 0.8rem; }
        }
    </style>
</head>
<body>

    <a href="index.html" class="back-home">← Back to Home</a>

    <div class="auth-wrap">
        <div class="auth-card">
            <div class="auth-logo">HASK TalentConnect</div>
            <p class="auth-sub">Connect • Grow • Succeed</p>

            <div class="tabs">
                <button class="tab-btn active" id="tabLogin" onclick="switchTab('login')">Login</button>
                <button class="tab-btn" id="tabSignup" onclick="switchTab('signup')">Sign Up</button>
            </div>

            <div id="messageBox" class="message-box"></div>

            <!-- ===== LOGIN ===== -->
            <div id="login-form" class="form-section active">
                <form onsubmit="handleLogin(event)">
                    <div class="form-group">
                        <label>Email Address</label>
                        <input type="email" id="loginEmail" placeholder="you@example.com" required>
                    </div>
                    <div class="form-group">
                        <label>Password</label>
                        <div class="input-wrap">
                            <input type="password" id="loginPassword" placeholder="Enter your password" required>
                            <button type="button" class="toggle-pw" onclick="togglePassword('loginPassword', this)">👁️</button>
                        </div>
                    </div>
                    <a href="#" class="forgot-link" onclick="handleForgotPassword(event)">Forgot Password?</a>
                    <button type="submit" class="btn-submit" id="loginBtn">Login to Your Account</button>
                </form>
                <p class="auth-footer">
                    Don't have an account? 
                    <a href="#" onclick="switchTab('signup'); return false;">Sign Up</a>
                </p>
            </div>

            <!-- ===== SIGNUP ===== -->
            <div id="signup-form" class="form-section">
                <form onsubmit="handleSignupStart(event)">
                    <div class="form-group">
                        <label>Full Name</label>
                        <input type="text" id="signupName" placeholder="Enter your full name" required>
                    </div>
                    <div class="form-group">
                        <label>Email Address</label>
                        <input type="email" id="signupEmail" placeholder="you@example.com" required>
                    </div>
                    <div class="form-group">
                        <label>Password</label>
                        <div class="input-wrap">
                            <input type="password" id="signupPassword" placeholder="Min 6 characters" required minlength="6">
                            <button type="button" class="toggle-pw" onclick="togglePassword('signupPassword', this)">👁️</button>
                        </div>
                    </div>
                    <div class="form-group">
                        <label>Confirm Password</label>
                        <div class="input-wrap">
                            <input type="password" id="signupConfirm" placeholder="Re-enter password" required minlength="6">
                            <button type="button" class="toggle-pw" onclick="togglePassword('signupConfirm', this)">👁️</button>
                        </div>
                    </div>
                    <div class="form-group">
                        <label>I am a...</label>
                        <div class="role-selector">
                            <div class="role-option selected" id="roleSeeker" onclick="selectRole('seeker')">
                                <span class="icon">👤</span>
                                <span>Job Seeker</span>
                            </div>
                            <div class="role-option" id="roleEmployer" onclick="selectRole('employer')">
                                <span class="icon">🏢</span>
                                <span>Employer</span>
                            </div>
                        </div>
                    </div>
                    <button type="submit" class="btn-submit" id="signupBtn">Send Verification Code</button>
                </form>
                <p class="auth-footer">
                    Already have an account? 
                    <a href="#" onclick="switchTab('login'); return false;">Login</a>
                </p>
            </div>

            <!-- ===== VERIFY ===== -->
            <div id="verify-form" class="form-section">
                <h3 style="color: #1a2a6c; text-align: center; margin-bottom: 6px; font-size: 1.15rem;">Verify Your Email</h3>
                <p style="text-align: center; color: #666; font-size: 0.85rem; margin-bottom: 18px;">
                    We sent a 6-digit code to<br>
                    <strong id="verifyEmail" style="color: #1a2a6c;"></strong>
                </p>
                <form onsubmit="handleVerifyCode(event)">
                    <div class="form-group">
                        <label>Verification Code</label>
                        <input type="text" id="verifyCode" class="code-input" placeholder="000000" maxlength="6" pattern="[0-9]{6}" required>
                    </div>
                    <button type="submit" class="btn-submit" id="verifyBtn">Verify & Create Account</button>
                </form>
                <p class="auth-footer">
                    Didn't receive? 
                    <a href="#" onclick="resendCode(event)">Resend</a> | 
                    <a href="#" onclick="backToSignup(event)">Back</a>
                </p>
            </div>

        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
        import { 
            getAuth, 
            createUserWithEmailAndPassword, 
            signInWithEmailAndPassword,
            sendPasswordResetEmail,
            updateProfile,
            signOut
        } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
        import { 
            getFirestore, 
            doc, 
            setDoc,
            getDoc,
            updateDoc,
            increment
        } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAreIiCnSheAeXc2wNeU7-qFj-qFhaXZAo",
            authDomain: "hask-talentconnect.firebaseapp.com",
            projectId: "hask-talentconnect",
            storageBucket: "hask-talentconnect.firebasestorage.app",
            messagingSenderId: "532290737820",
            appId: "1:532290737820:web:49f70281b0f34837757f59"
        };

        const EMAILJS_SERVICE_ID = "service_b10tgpg";
        const EMAILJS_TEMPLATE_ID = "template_ekb1wzl";
        const EMAILJS_PUBLIC_KEY = "QYEECDuF-iOCcOaoU";
        const EMAIL_LIMIT = 200;

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let selectedRole = 'seeker';
        let pendingUser = null;
        let generatedCode = null;
        let codeExpiry = null;

        // ===== Redirect param =====
        const urlParams = new URLSearchParams(window.location.search);
        const redirectTo = urlParams.get('redirect') || 'dashboard.html';
        const presetRole = urlParams.get('role') || '';

        if (presetRole === 'employer') {
            setTimeout(() => selectRole('employer'), 100);
        }

        // ===== Helpers =====
        function showMessage(text, type = 'info') {
            const box = document.getElementById('messageBox');
            box.textContent = text;
            box.className = 'message-box show ' + type;
        }

        function hideMessage() {
            document.getElementById('messageBox').className = 'message-box';
        }

        window.switchTab = function(tab) {
            hideMessage();
            const loginForm = document.getElementById('login-form');
            const signupForm = document.getElementById('signup-form');
            const verifyForm = document.getElementById('verify-form');
            const tabLogin = document.getElementById('tabLogin');
            const tabSignup = document.getElementById('tabSignup');

            [loginForm, signupForm, verifyForm].forEach(f => f.classList.remove('active'));
            tabLogin.classList.remove('active');
            tabSignup.classList.remove('active');

            if (tab === 'login') {
                loginForm.classList.add('active');
                tabLogin.classList.add('active');
            } else {
                signupForm.classList.add('active');
                tabSignup.classList.add('active');
            }
        };

        window.togglePassword = function(id, btn) {
            const input = document.getElementById(id);
            if (input.type === 'password') {
                input.type = 'text';
                btn.textContent = '🙈';
            } else {
                input.type = 'password';
                btn.textContent = '👁️';
            }
        };

        window.selectRole = function(role) {
            selectedRole = role;
            document.getElementById('roleSeeker').classList.remove('selected');
            document.getElementById('roleEmployer').classList.remove('selected');
            if (role === 'seeker') {
                document.getElementById('roleSeeker').classList.add('selected');
            } else {
                document.getElementById('roleEmployer').classList.add('selected');
            }
        };

        function generateCode() {
            return Math.floor(100000 + Math.random() * 900000).toString();
        }

        // ===== Generate Unique User ID (JS-2026-XXXX) =====
        async function generateUserID(role) {
            const year = new Date().getFullYear();
            const counterDoc = doc(db, "stats", "user_counter");
            const snap = await getDoc(counterDoc);

            let nextNum = 1;
            if (snap.exists()) {
                nextNum = (snap.data().count || 0) + 1;
            }
            await setDoc(counterDoc, { count: nextNum }, { merge: true });

            const prefix = role === 'employer' ? 'EM' : 'JS';
            const padded = String(nextNum).padStart(4, '0');
            return `${prefix}-${year}-${padded}`;
        }

        // ===== Email Counter =====
        async function getEmailCount() {
            try {
                const snap = await getDoc(doc(db, "stats", "email_counter"));
                return snap.exists() ? (snap.data().count || 0) : 0;
            } catch (e) { return 0; }
        }

        async function incrementEmailCount() {
            try {
                const ref = doc(db, "stats", "email_counter");
                const snap = await getDoc(ref);
                if (!snap.exists()) await setDoc(ref, { count: 1 });
                else await updateDoc(ref, { count: increment(1) });
            } catch (e) {}
        }

        // ===== EmailJS Send =====
        async function sendEmailJS(toEmail, toName, code) {
            const res = await fetch("https://api.emailjs.com/api/v1.0/email/send", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    service_id: EMAILJS_SERVICE_ID,
                    template_id: EMAILJS_TEMPLATE_ID,
                    user_id: EMAILJS_PUBLIC_KEY,
                    template_params: {
                        to_email: toEmail,
                        to_name: toName,
                        verification_code: code,
                        email: toEmail
                    }
                })
            });
            if (!res.ok) throw new Error("Email send failed");
            await incrementEmailCount();
        }

        // ===== Signup Step 1 =====
        window.handleSignupStart = async function(event) {
            event.preventDefault();
            hideMessage();

            const name = document.getElementById('signupName').value.trim();
            const email = document.getElementById('signupEmail').value.trim();
            const password = document.getElementById('signupPassword').value;
            const confirm = document.getElementById('signupConfirm').value;
            const btn = document.getElementById('signupBtn');

            if (password !== confirm) {
                showMessage('❌ Passwords do not match!', 'error');
                return;
            }
            if (password.length < 6) {
                showMessage('❌ Password must be at least 6 characters.', 'error');
                return;
            }

            btn.disabled = true;
            btn.innerHTML = 'Please wait...';

            try {
                const currentCount = await getEmailCount();
                if (currentCount >= EMAIL_LIMIT) {
                    showMessage('❌ Email limit reached. Please try later.', 'error');
                    btn.disabled = false;
                    btn.textContent = 'Send Verification Code';
                    return;
                }

                generatedCode = generateCode();
                codeExpiry = Date.now() + (10 * 60 * 1000);
                pendingUser = { name, email, password, role: selectedRole };

                await sendEmailJS(email, name, generatedCode);

                document.getElementById('verifyEmail').textContent = email;
                document.getElementById('login-form').classList.remove('active');
                document.getElementById('signup-form').classList.remove('active');
                document.getElementById('verify-form').classList.add('active');
                document.getElementById('tabLogin').classList.remove('active');
                document.getElementById('tabSignup').classList.remove('active');

                showMessage('✅ Code sent! Check your email inbox.', 'success');
            } catch (err) {
                console.error(err);
                showMessage('❌ Failed: ' + err.message, 'error');
            } finally {
                btn.disabled = false;
                btn.textContent = 'Send Verification Code';
            }
        };

        // ===== Verify Code =====
        window.handleVerifyCode = async function(event) {
            event.preventDefault();
            hideMessage();

            const entered = document.getElementById('verifyCode').value.trim();
            const btn = document.getElementById('verifyBtn');

            if (!generatedCode || !pendingUser) {
                showMessage('❌ Please start signup again.', 'error');
                return;
            }
            if (Date.now() > codeExpiry) {
                showMessage('❌ Code expired. Please resend.', 'error');
                return;
            }
            if (entered !== generatedCode) {
                showMessage('❌ Incorrect code.', 'error');
                return;
            }

            btn.disabled = true;
            btn.innerHTML = 'Creating account...';

            try {
                const cred = await createUserWithEmailAndPassword(auth, pendingUser.email, pendingUser.password);
                const user = cred.user;
                await updateProfile(user, { displayName: pendingUser.name });

                // Generate unique User ID
                const userId = await generateUserID(pendingUser.role);

                await setDoc(doc(db, "users", user.uid), {
                    uid: user.uid,
                    userId: userId,
                    name: pendingUser.name,
                    email: pendingUser.email,
                    role: pendingUser.role,
                    status: 'active',
                    createdAt: new Date().toISOString()
                });

                showMessage('✅ Account created! Your ID: ' + userId, 'success');
                sessionStorage.setItem('hask_logged_in', 'true');
                setTimeout(() => {
                    window.location.replace(redirectTo);
                }, 1500);

            } catch (err) {
                console.error(err);
                let msg = 'Something went wrong.';
                if (err.code === 'auth/email-already-in-use') msg = '❌ This email is already registered.';
                else if (err.code === 'auth/weak-password') msg = '❌ Password is too weak.';
                else msg = '❌ ' + err.message;
                showMessage(msg, 'error');
                btn.disabled = false;
                btn.textContent = 'Verify & Create Account';
            }
        };

        // ===== Resend / Back =====
        window.resendCode = async function(e) {
            e.preventDefault();
            if (!pendingUser) return;
            hideMessage();
            try {
                generatedCode = generateCode();
                codeExpiry = Date.now() + (10 * 60 * 1000);
                await sendEmailJS(pendingUser.email, pendingUser.name, generatedCode);
                showMessage('✅ New code sent!', 'success');
            } catch (err) {
                showMessage('❌ ' + err.message, 'error');
            }
        };

        window.backToSignup = function(e) {
            e.preventDefault();
            pendingUser = null;
            generatedCode = null;
            document.getElementById('verify-form').classList.remove('active');
            document.getElementById('signup-form').classList.add('active');
            document.getElementById('tabSignup').classList.add('active');
            hideMessage();
        };

        // ===== Login =====
        window.handleLogin = async function(event) {
            event.preventDefault();
            hideMessage();

            const email = document.getElementById('loginEmail').value.trim();
            const password = document.getElementById('loginPassword').value;
            const btn = document.getElementById('loginBtn');

            btn.disabled = true;
            btn.innerHTML = 'Logging in...';

            try {
                const cred = await signInWithEmailAndPassword(auth, email, password);

                // Check blocked
                const userDoc = await getDoc(doc(db, "users", cred.user.uid));
                if (userDoc.exists() && userDoc.data().status === 'blocked') {
                    await signOut(auth);
                    showMessage('🚫 Your account has been blocked.', 'error');
                    btn.disabled = false;
                    btn.textContent = 'Login to Your Account';
                    return;
                }

                showMessage('✅ Login successful! Redirecting...', 'success');
                sessionStorage.setItem('hask_logged_in', 'true');
                setTimeout(() => {
                    window.location.replace(redirectTo);
                }, 800);

            } catch (err) {
                console.error(err);
                let msg = 'Something went wrong.';
                if (err.code === 'auth/user-not-found') msg = '❌ No account found.';
                else if (err.code === 'auth/wrong-password') msg = '❌ Incorrect password.';
                else if (err.code === 'auth/invalid-credential') msg = '❌ Invalid email or password.';
                else if (err.code === 'auth/invalid-email') msg = '❌ Invalid email.';
                else if (err.code === 'auth/too-many-requests') msg = '❌ Too many attempts. Try later.';
                else msg = '❌ ' + err.message;
                showMessage(msg, 'error');
                btn.disabled = false;
                btn.textContent = 'Login to Your Account';
            }
        };

        // ===== Forgot Password =====
        window.handleForgotPassword = async function(e) {
            e.preventDefault();
            hideMessage();
            const email = document.getElementById('loginEmail').value.trim();
            if (!email) {
                showMessage('⚠️ Enter your email first.', 'error');
                return;
            }
            try {
                await sendPasswordResetEmail(auth, email);
                showMessage('✅ Reset link sent to ' + email, 'success');
            } catch (err) {
                showMessage('❌ ' + err.message, 'error');
            }
        };

        // ===== Back button protection =====
        window.addEventListener('pageshow', function(event) {
            if (event.persisted) window.location.reload();
        });
    </script>

</body>
</html>
