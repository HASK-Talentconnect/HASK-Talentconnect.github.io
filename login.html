<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login / Sign Up - HASK TalentConnect</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* ===== Login Page Specific Styles ===== */
        .login-body {
            background: linear-gradient(135deg, #1a2a6c 0%, #b21f1f 50%, #fdbb2d 100%);
            background-size: 400% 400%;
            animation: gradientShift 15s ease infinite;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px 15px;
            position: relative;
            overflow-x: hidden;
        }

        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .login-body::before,
        .login-body::after {
            content: '';
            position: absolute;
            border-radius: 50%;
            background: rgba(255,255,255,0.08);
            animation: float 8s ease-in-out infinite;
        }
        .login-body::before {
            width: 300px; height: 300px;
            top: -100px; left: -100px;
        }
        .login-body::after {
            width: 400px; height: 400px;
            bottom: -150px; right: -150px;
            animation-delay: 2s;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0) scale(1); }
            50% { transform: translateY(-30px) scale(1.05); }
        }

        .login-container {
            background: rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 25px;
            padding: 45px 40px;
            width: 100%;
            max-width: 460px;
            box-shadow: 0 25px 60px rgba(0,0,0,0.35);
            position: relative;
            z-index: 10;
            color: white;
        }

        .login-logo {
            text-align: center;
            font-size: 2rem;
            font-weight: bold;
            letter-spacing: 2px;
            margin-bottom: 5px;
            color: #f9c74f;
        }

        .login-tagline {
            text-align: center;
            font-size: 0.95rem;
            color: rgba(255,255,255,0.85);
            margin-bottom: 30px;
        }

        .tabs {
            display: flex;
            background: rgba(255,255,255,0.1);
            border-radius: 50px;
            padding: 5px;
            margin-bottom: 30px;
        }

        .tab-btn {
            flex: 1;
            background: transparent;
            border: none;
            color: rgba(255,255,255,0.75);
            padding: 12px;
            cursor: pointer;
            border-radius: 50px;
            font-weight: 600;
            font-size: 1rem;
            transition: 0.3s;
            font-family: inherit;
        }

        .tab-btn.active {
            background: #f9c74f;
            color: #1a2a6c;
            box-shadow: 0 5px 15px rgba(249,199,79,0.4);
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            font-size: 0.9rem;
            margin-bottom: 8px;
            color: rgba(255,255,255,0.9);
        }

        .form-group input {
            width: 100%;
            padding: 14px 18px;
            border: 1px solid rgba(255,255,255,0.25);
            background: rgba(255,255,255,0.08);
            border-radius: 12px;
            color: white;
            font-size: 1rem;
            outline: none;
            transition: 0.3s;
            font-family: inherit;
        }

        .form-group input::placeholder {
            color: rgba(255,255,255,0.5);
        }

        .form-group input:focus {
            border-color: #f9c74f;
            background: rgba(255,255,255,0.15);
            box-shadow: 0 0 0 3px rgba(249,199,79,0.2);
        }

        .role-selector {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-top: 8px;
        }

        .role-option {
            background: rgba(255,255,255,0.08);
            border: 2px solid rgba(255,255,255,0.15);
            border-radius: 12px;
            padding: 15px 10px;
            text-align: center;
            cursor: pointer;
            transition: 0.3s;
        }

        .role-option:hover {
            background: rgba(255,255,255,0.15);
        }

        .role-option.selected {
            border-color: #f9c74f;
            background: rgba(249,199,79,0.2);
        }

        .role-option .icon {
            font-size: 1.8rem;
            display: block;
            margin-bottom: 5px;
        }

        .role-option span {
            font-size: 0.9rem;
            font-weight: 500;
        }

        .btn-submit {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #f9c74f, #fcb045);
            border: none;
            border-radius: 12px;
            color: #1a2a6c;
            font-weight: bold;
            font-size: 1.05rem;
            cursor: pointer;
            transition: 0.3s;
            margin-top: 10px;
            font-family: inherit;
            letter-spacing: 0.5px;
        }

        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(249,199,79,0.4);
        }

        .btn-submit:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .divider {
            display: flex;
            align-items: center;
            text-align: center;
            margin: 25px 0;
            color: rgba(255,255,255,0.6);
            font-size: 0.85rem;
        }

        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: rgba(255,255,255,0.2);
        }

        .divider span {
            padding: 0 15px;
        }

        .social-login {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .social-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 12px;
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 12px;
            color: white;
            text-decoration: none;
            font-weight: 500;
            font-size: 0.9rem;
            transition: 0.3s;
            cursor: pointer;
        }

        .social-btn:hover {
            background: rgba(255,255,255,0.2);
            transform: translateY(-2px);
        }

        .forgot-link {
            display: block;
            text-align: right;
            color: rgba(255,255,255,0.8);
            font-size: 0.85rem;
            text-decoration: none;
            margin-top: -10px;
            margin-bottom: 15px;
            transition: 0.3s;
        }

        .forgot-link:hover {
            color: #f9c74f;
        }

        .login-footer {
            text-align: center;
            margin-top: 25px;
            font-size: 0.9rem;
            color: rgba(255,255,255,0.8);
        }

        .login-footer a {
            color: #f9c74f;
            text-decoration: none;
            font-weight: 600;
        }

        .login-footer a:hover {
            text-decoration: underline;
        }

        .back-home {
            position: absolute;
            top: 25px;
            left: 25px;
            color: white;
            text-decoration: none;
            font-weight: 500;
            background: rgba(255,255,255,0.15);
            padding: 10px 20px;
            border-radius: 25px;
            font-size: 0.9rem;
            transition: 0.3s;
            z-index: 20;
            backdrop-filter: blur(10px);
        }

        .back-home:hover {
            background: rgba(255,255,255,0.3);
            transform: translateX(-3px);
        }

        .form-section {
            display: none;
        }

        .form-section.active {
            display: block;
            animation: fadeIn 0.4s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Message Box */
        .message-box {
            padding: 12px 18px;
            border-radius: 12px;
            font-size: 0.9rem;
            margin-bottom: 18px;
            display: none;
            text-align: center;
            font-weight: 500;
        }

        .message-box.show {
            display: block;
            animation: fadeIn 0.3s ease;
        }

        .message-box.error {
            background: rgba(220, 53, 69, 0.25);
            border: 1px solid rgba(220, 53, 69, 0.5);
            color: #ffb3ba;
        }

        .message-box.success {
            background: rgba(40, 167, 69, 0.25);
            border: 1px solid rgba(40, 167, 69, 0.5);
            color: #b3ffc4;
        }

        .message-box.info {
            background: rgba(249, 199, 79, 0.25);
            border: 1px solid rgba(249, 199, 79, 0.5);
            color: #ffe9b3;
        }

        /* Loading spinner */
        .spinner {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid rgba(26,42,108,0.3);
            border-top-color: #1a2a6c;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
            margin-right: 8px;
            vertical-align: middle;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        @media (max-width: 500px) {
            .login-container {
                padding: 35px 25px;
            }
            .login-logo {
                font-size: 1.6rem;
            }
            .back-home {
                top: 15px;
                left: 15px;
                padding: 8px 15px;
                font-size: 0.8rem;
            }
        }
    </style>
</head>
<body class="login-body">

    <a href="index.html" class="back-home">← Back to Home</a>

    <div class="login-container">

        <div class="login-logo">HASK TalentConnect</div>
        <p class="login-tagline">Connect • Grow • Succeed</p>

        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('login')">Login</button>
            <button class="tab-btn" onclick="switchTab('signup')">Sign Up</button>
        </div>

        <!-- Message Box -->
        <div id="messageBox" class="message-box"></div>

        <!-- ===== LOGIN FORM ===== -->
        <div id="login-form" class="form-section active">
            <form onsubmit="handleLogin(event)">
                <div class="form-group">
                    <label>Email Address</label>
                    <input type="email" id="loginEmail" placeholder="you@example.com" required>
                </div>

                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="loginPassword" placeholder="••••••••" required>
                </div>

                <a href="#" class="forgot-link" onclick="handleForgotPassword(event)">Forgot Password?</a>

                <button type="submit" class="btn-submit" id="loginBtn">Login to Your Account</button>

                <div class="divider"><span>OR</span></div>

                <div class="social-login">
                    <a href="#" class="social-btn">🔵 Google</a>
                    <a href="#" class="social-btn">💼 LinkedIn</a>
                </div>
            </form>

            <p class="login-footer">
                Don't have an account? 
                <a href="#" onclick="switchTab('signup'); return false;">Sign Up</a>
            </p>
        </div>

        <!-- ===== SIGNUP FORM ===== -->
        <div id="signup-form" class="form-section">
            <form onsubmit="handleSignup(event)">
                <div class="form-group">
                    <label>Full Name</label>
                    <input type="text" id="signupName" placeholder="Enter your full name" required>
                </div>

                <div class="form-group">
                    <label>Email Address</label>
                    <input type="email" id="signupEmail" placeholder="you@example.com" required>
                </div>

                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="signupPassword" placeholder="Create a strong password (min 6 chars)" required minlength="6">
                </div>

                <div class="form-group">
                    <label>I am a...</label>
                    <div class="role-selector">
                        <div class="role-option selected" id="roleSeeker" onclick="selectRole('seeker')">
                            <span class="icon">👤</span>
                            <span>Job Seeker</span>
                        </div>
                        <div class="role-option" id="roleEmployer" onclick="selectRole('employer')">
                            <span class="icon">🏢</span>
                            <span>Employer</span>
                        </div>
                    </div>
                </div>

                <button type="submit" class="btn-submit" id="signupBtn">Create My Account</button>

                <div class="divider"><span>OR</span></div>

                <div class="social-login">
                    <a href="#" class="social-btn">🔵 Google</a>
                    <a href="#" class="social-btn">💼 LinkedIn</a>
                </div>
            </form>

            <p class="login-footer">
                Already have an account? 
                <a href="#" onclick="switchTab('login'); return false;">Login</a>
            </p>
        </div>

    </div>

    <!-- ===== Firebase SDK ===== -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
        import { 
            getAuth, 
            createUserWithEmailAndPassword, 
            signInWithEmailAndPassword,
            sendPasswordResetEmail,
            updateProfile
        } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
        import { 
            getFirestore, 
            doc, 
            setDoc 
        } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

        // Firebase Configuration
        const firebaseConfig = {
            apiKey: "AIzaSyAreIiCnSheAeXc2wNeU7-qFj-qFhaXZAo",
            authDomain: "hask-talentconnect.firebaseapp.com",
            projectId: "hask-talentconnect",
            storageBucket: "hask-talentconnect.firebasestorage.app",
            messagingSenderId: "532290737820",
            appId: "1:532290737820:web:49f70281b0f34837757f59",
            measurementId: "G-KVHDN2H1F0"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let selectedRole = 'seeker';

        // Show message
        function showMessage(text, type = 'info') {
            const box = document.getElementById('messageBox');
            box.textContent = text;
            box.className = 'message-box show ' + type;
        }

        function hideMessage() {
            const box = document.getElementById('messageBox');
            box.className = 'message-box';
        }

        // Tab switching
        window.switchTab = function(tab) {
            hideMessage();
            const loginForm = document.getElementById('login-form');
            const signupForm = document.getElementById('signup-form');
            const tabBtns = document.querySelectorAll('.tab-btn');

            if (tab === 'login') {
                loginForm.classList.add('active');
                signupForm.classList.remove('active');
                tabBtns[0].classList.add('active');
                tabBtns[1].classList.remove('active');
            } else {
                signupForm.classList.add('active');
                loginForm.classList.remove('active');
                tabBtns[1].classList.add('active');
                tabBtns[0].classList.remove('active');
            }
        };

        // Role selection
        window.selectRole = function(role) {
            selectedRole = role;
            document.getElementById('roleSeeker').classList.remove('selected');
            document.getElementById('roleEmployer').classList.remove('selected');
            if (role === 'seeker') {
                document.getElementById('roleSeeker').classList.add('selected');
            } else {
                document.getElementById('roleEmployer').classList.add('selected');
            }
        };

        // ===== SIGNUP =====
        window.handleSignup = async function(event) {
            event.preventDefault();
            hideMessage();

            const name = document.getElementById('signupName').value.trim();
            const email = document.getElementById('signupEmail').value.trim();
            const password = document.getElementById('signupPassword').value;
            const btn = document.getElementById('signupBtn');

            btn.disabled = true;
            btn.innerHTML = '<span class="spinner"></span>Creating account...';

            try {
                const userCredential = await createUserWithEmailAndPassword(auth, email, password);
                const user = userCredential.user;

                await updateProfile(user, { displayName: name });

                await setDoc(doc(db, "users", user.uid), {
                    uid: user.uid,
                    name: name,
                    email: email,
                    role: selectedRole,
                    createdAt: new Date().toISOString()
                });

                showMessage('✅ Account created successfully! Redirecting...', 'success');

                setTimeout(() => {
                    window.location.href = 'dashboard.html';
                }, 1500);

            } catch (error) {
                console.error(error);
                let msg = 'Something went wrong. Please try again.';
                if (error.code === 'auth/email-already-in-use') {
                    msg = '❌ This email is already registered. Please login instead.';
                } else if (error.code === 'auth/weak-password') {
                    msg = '❌ Password is too weak. Use at least 6 characters.';
                } else if (error.code === 'auth/invalid-email') {
                    msg = '❌ Invalid email address.';
                } else {
                    msg = '❌ ' + error.message;
                }
                showMessage(msg, 'error');
                btn.disabled = false;
                btn.textContent = 'Create My Account';
            }
        };

        // ===== LOGIN =====
        window.handleLogin = async function(event) {
            event.preventDefault();
            hideMessage();

            const email = document.getElementById('loginEmail').value.trim();
            const password = document.getElementById('loginPassword').value;
            const btn = document.getElementById('loginBtn');

            btn.disabled = true;
            btn.innerHTML = '<span class="spinner"></span>Logging in...';

            try {
                await signInWithEmailAndPassword(auth, email, password);
                showMessage('✅ Login successful! Redirecting...', 'success');

                setTimeout(() => {
                    window.location.href = 'dashboard.html';
                }, 1200);

            } catch (error) {
                console.error(error);
                let msg = 'Something went wrong. Please try again.';
                if (error.code === 'auth/user-not-found') {
                    msg = '❌ No account found with this email.';
                } else if (error.code === 'auth/wrong-password') {
                    msg = '❌ Incorrect password. Please try again.';
                } else if (error.code === 'auth/invalid-credential') {
                    msg = '❌ Invalid email or password.';
                } else if (error.code === 'auth/invalid-email') {
                    msg = '❌ Invalid email address.';
                } else if (error.code === 'auth/too-many-requests') {
                    msg = '❌ Too many failed attempts. Please try again later.';
                } else {
                    msg = '❌ ' + error.message;
                }
                showMessage(msg, 'error');
                btn.disabled = false;
                btn.textContent = 'Login to Your Account';
            }
        };

        // ===== FORGOT PASSWORD =====
        window.handleForgotPassword = async function(event) {
            event.preventDefault();
            hideMessage();

            const email = document.getElementById('loginEmail').value.trim();

            if (!email) {
                showMessage('⚠️ Please enter your email address first.', 'error');
                return;
            }

            try {
                await sendPasswordResetEmail(auth, email);
                showMessage('✅ Password reset link sent to ' + email, 'success');
            } catch (error) {
                console.error(error);
                showMessage('❌ ' + error.message, 'error');
            }
        };
    </script>

</body>
</html>
