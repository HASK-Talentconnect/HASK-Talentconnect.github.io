<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Job Dashboard - HASK TalentConnect</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="dashboard.css">
</head>
<body>

    <nav class="navbar">
        <div class="logo">HASK TalentConnect</div>
        <ul class="menu">
            <li><a href="index.html">Home</a></li>
            <li><a href="dashboard.html" class="active-link">Job Dashboard</a></li>
            <li><a href="profile.html">Profile</a></li>
            <li><a href="job-applied.html">Applied Jobs</a></li>
            <li><a href="#" id="logoutBtn" class="btn-primary">Logout</a></li>
        </ul>
    </nav>

    <div class="dash-wrap">

        <!-- Header with Completion + Browse All -->
        <div class="dash-header">
            <div>
                <h1>👋 Welcome back, <span id="userName">User</span>!</h1>
                <p class="section-note">Jobs matched to your profile</p>
            </div>

            <div class="header-actions">
                <div class="profile-completion-mini">
                    <div class="pc-label">Profile Complete</div>
                    <div class="pc-bar-bg">
                        <div class="pc-bar-fill" id="pcBarFill"></div>
                    </div>
                    <div class="pc-percent" id="pcPercent">0%</div>
                </div>
                <a href="index.html" class="btn-browse-all-top">🌐 All Jobs</a>
            </div>
        </div>

        <!-- Jobs List -->
        <div class="jobs-list" id="jobsList">
            <div class="loading-box">
                <div class="loader"></div>
                <p>Matching jobs to your profile...</p>
            </div>
        </div>

    </div>

    <footer>
        <p>&copy; 2025 HASK TalentConnect. All rights reserved.</p>
    </footer>

    <script type="module" src="dashboard.js"></script>
</body>
</html>
