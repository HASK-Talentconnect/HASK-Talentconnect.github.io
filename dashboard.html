<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - HASK TalentConnect</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .user-header {
            background: white;
            padding: 25px 30px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
            margin-bottom: 22px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }

        .user-info-block {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .user-avatar {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: #1a2a6c;
            color: #f9c74f;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 1.4rem;
            flex-shrink: 0;
        }

        .user-name-title h2 {
            color: #1a2a6c;
            font-size: 1.25rem;
            margin-bottom: 3px;
        }

        .user-id-tag {
            display: inline-block;
            background: #e8f4fd;
            color: #0277bd;
            padding: 3px 10px;
            border-radius: 12px;
            font-size: 0.78rem;
            font-weight: 600;
            font-family: monospace;
            margin-right: 6px;
        }

        .role-tag {
            display: inline-block;
            background: #f9c74f;
            color: #1a2a6c;
            padding: 3px 10px;
            border-radius: 12px;
            font-size: 0.78rem;
            font-weight: 700;
        }

        .btn-logout-dash {
            background: #dc3545;
            color: white;
            padding: 10px 22px;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            font-family: inherit;
            font-size: 0.88rem;
            transition: 0.2s;
        }

        .btn-logout-dash:hover { background: #b02a37; }

        .stats-row-dash {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 14px;
            margin-bottom: 25px;
        }

        .stat-dash {
            background: white;
            padding: 22px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
            border-left: 4px solid #29b6f6;
        }

        .stat-dash .icon {
            font-size: 1.6rem;
            margin-bottom: 8px;
        }

        .stat-dash .num {
            font-size: 1.7rem;
            font-weight: bold;
            color: #1a2a6c;
        }

        .stat-dash .lbl {
            color: #666;
            font-size: 0.85rem;
            margin-top: 3px;
        }

        .section-head {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 25px 0 12px;
        }

        .section-head h3 {
            color: #1a2a6c;
            font-size: 1.15rem;
        }

        .section-head a {
            color: #29b6f6;
            font-size: 0.85rem;
            font-weight: 600;
        }

        .action-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 14px;
        }

        .action-card {
            background: white;
            padding: 22px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
            text-align: center;
            transition: 0.2s;
            cursor: pointer;
            border: 2px solid transparent;
            text-decoration: none;
            color: inherit;
            display: block;
        }

        .action-card:hover {
            border-color: #1a2a6c;
            transform: translateY(-3px);
        }

        .action-card .icon { font-size: 2rem; margin-bottom: 8px; }
        .action-card h4 { color: #1a2a6c; font-size: 1rem; margin-bottom: 5px; }
        .action-card p { color: #666; font-size: 0.82rem; }

        .apps-list { background: white; border-radius: 12px; overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
        .app-row {
            padding: 15px 20px;
            border-bottom: 1px solid #eef1f5;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }
        .app-row:last-child { border-bottom: none; }
        .app-row .app-title { color: #1a2a6c; font-weight: 600; font-size: 0.95rem; }
        .app-row .app-company { color: #666; font-size: 0.82rem; margin-top: 3px; }

        .status-tag {
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 0.75rem;
            font-weight: 600;
        }
        .status-pending { background: #fff3cd; color: #856404; }
        .status-reviewed { background: #d1ecf1; color: #0c5460; }
        .status-accepted { background: #d4edda; color: #155724; }
        .status-rejected { background: #f8d7da; color: #721c24; }

        .loading-screen {
            position: fixed; inset: 0;
            background: #1a2a6c; color: white;
            display: flex; flex-direction: column;
            justify-content: center; align-items: center;
            z-index: 9999; gap: 15px;
        }
    </style>
</head>
<body>

    <div class="loading-screen" id="loadingScreen">
        <div class="spinner"></div>
        <p>Loading...</p>
    </div>

    <nav class="navbar">
        <div class="logo">HASK TalentConnect</div>
        <ul class="menu">
            <li><a href="jobs.html">Browse Jobs</a></li>
            <li><a href="dashboard.html">Dashboard</a></li>
        </ul>
    </nav>

    <div class="container">

        <!-- User Header -->
        <div class="user-header">
            <div class="user-info-block">
                <div class="user-avatar" id="userAvatar">?</div>
                <div class="user-name-title">
                    <h2 id="userName">Loading...</h2>
                    <span class="user-id-tag" id="userIdTag">—</span>
                    <span class="role-tag" id="roleTag">—</span>
                </div>
            </div>
            <button class="btn-logout-dash" onclick="handleLogout()">Logout</button>
        </div>

        <!-- Stats -->
        <div class="stats-row-dash" id="statsRow">
            <div class="stat-dash">
                <div class="icon">📄</div>
                <div class="num" id="statApps">0</div>
                <div class="lbl">Applications Sent</div>
            </div>
            <div class="stat-dash" style="border-left-color: #f9c74f;">
                <div class="icon">⭐</div>
                <div class="num">0</div>
                <div class="lbl">Saved Jobs</div>
            </div>
            <div class="stat-dash" style="border-left-color: #28a745;">
                <div class="icon">👁️</div>
                <div class="num">0</div>
                <div class="lbl">Profile Views</div>
            </div>
            <div class="stat-dash" style="border-left-color: #764ba2;">
                <div class="icon">💬</div>
                <div class="num">0</div>
                <div class="lbl">Messages</div>
            </div>
        </div>

        <!-- Actions -->
        <div class="section-head">
            <h3>Quick Actions</h3>
        </div>
        <div class="action-grid" id="actionGrid">
            <!-- Filled by JS -->
        </div>

        <!-- Applications -->
        <div class="section-head">
            <h3>My Applications</h3>
            <a href="jobs.html">Browse More Jobs →</a>
        </div>
        <div class="apps-list" id="appsList">
            <div class="app-row" style="justify-content: center; color: #888; padding: 40px;">
                Loading applications...
            </div>
        </div>

    </div>

    <footer>
        <p>&copy; 2025 HASK TalentConnect. All rights reserved.</p>
    </footer>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
        import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
        import { getFirestore, doc, getDoc, collection, query, where, getDocs } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAreIiCnSheAeXc2wNeU7-qFj-qFhaXZAo",
            authDomain: "hask-talentconnect.firebaseapp.com",
            projectId: "hask-talentconnect",
            storageBucket: "hask-talentconnect.firebasestorage.app",
            messagingSenderId: "532290737820",
            appId: "1:532290737820:web:49f70281b0f34837757f59"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        onAuthStateChanged(auth, async (user) => {
            if (!user) {
                window.location.replace('login.html');
                return;
            }

            try {
                const userDoc = await getDoc(doc(db, "users", user.uid));
                let data = {
                    name: user.displayName || user.email.split('@')[0],
                    email: user.email,
                    role: 'seeker',
                    userId: '-'
                };
                if (userDoc.exists()) data = { ...data, ...userDoc.data() };

                renderDashboard(data, user.uid);
                document.getElementById('loadingScreen').style.display = 'none';
            } catch (err) {
                console.error(err);
                document.getElementById('loadingScreen').style.display = 'none';
            }
        });

        async function renderDashboard(data, uid) {
            const firstName = data.name.split(' ')[0];
            document.getElementById('userName').textContent = data.name;
            document.getElementById('userAvatar').textContent = firstName.charAt(0).toUpperCase();
            document.getElementById('userIdTag').textContent = '🆔 ' + (data.userId || '-');
            document.getElementById('roleTag').textContent = data.role === 'employer' ? '🏢 Employer' : '👤 Job Seeker';

            // Actions
            const actionGrid = document.getElementById('actionGrid');
            if (data.role === 'employer') {
                actionGrid.innerHTML = `
                    <a href="post-job.html" class="action-card">
                        <div class="icon">➕</div>
                        <h4>Post a Job</h4>
                        <p>Create new job posting</p>
                    </a>
                    <a href="#" class="action-card" onclick="alert('Coming soon!'); return false;">
                        <div class="icon">📋</div>
                        <h4>My Job Posts</h4>
                        <p>Manage your listings</p>
                    </a>
                    <a href="#" class="action-card" onclick="alert('Coming soon!'); return false;">
                        <div class="icon">👥</div>
                        <h4>View Applicants</h4>
                        <p>Review applications</p>
                    </a>
                    <a href="#" class="action-card" onclick="alert('Coming soon!'); return false;">
                        <div class="icon">🏢</div>
                        <h4>Company Profile</h4>
                        <p>Update company info</p>
                    </a>
                `;
            } else {
                actionGrid.innerHTML = `
                    <a href="jobs.html" class="action-card">
                        <div class="icon">🔍</div>
                        <h4>Browse Jobs</h4>
                        <p>Find new opportunities</p>
                    </a>
                    <a href="#" class="action-card" onclick="alert('Coming soon!'); return false;">
                        <div class="icon">👤</div>
                        <h4>My Profile</h4>
                        <p>Update CV & skills</p>
                    </a>
                    <a href="#" class="action-card" onclick="alert('Coming soon!'); return false;">
                        <div class="icon">⭐</div>
                        <h4>Saved Jobs</h4>
                        <p>Your bookmarked jobs</p>
                    </a>
                    <a href="#" class="action-card" onclick="alert('Coming soon!'); return false;">
                        <div class="icon">🤖</div>
                        <h4>AI Job Match</h4>
                        <p>Personalized jobs</p>
                    </a>
                `;
            }

            // Load applications
            await loadApplications(uid);
        }

        async function loadApplications(uid) {
            const list = document.getElementById('appsList');
            try {
                const q = query(collection(db, "applications"), where("userId", "==", uid));
                const snap = await getDocs(q);

                if (snap.empty) {
                    list.innerHTML = `
                        <div class="app-row" style="justify-content: center; color: #888; padding: 40px; flex-direction: column; gap: 10px;">
                            <div style="font-size: 2.5rem;">📭</div>
                            <div>You haven't applied to any jobs yet.</div>
                            <a href="jobs.html" class="btn-primary" style="margin-top: 8px;">Browse Jobs →</a>
                        </div>
                    `;
                    document.getElementById('statApps').textContent = '0';
                    return;
                }

                const apps = [];
                snap.forEach(d => apps.push({ id: d.id, ...d.data() }));
                apps.sort((a, b) => (b.appliedAt || '').localeCompare(a.appliedAt || ''));

                document.getElementById('statApps').textContent = apps.length;

                list.innerHTML = apps.map(a => `
                    <div class="app-row">
                        <div>
                            <div class="app-title">${escapeHtml(a.jobTitle || 'Job')}</div>
                            <div class="app-company">🏢 ${escapeHtml(a.company || '-')} • Applied ${timeAgo(a.appliedAt)}</div>
                        </div>
                        <span class="status-tag status-${a.status || 'pending'}">${(a.status || 'pending').toUpperCase()}</span>
                    </div>
                `).join('');

            } catch (err) {
                console.error(err);
                list.innerHTML = `<div class="app-row" style="justify-content: center; color: #c33; padding: 30px;">Error loading applications</div>`;
            }
        }

        window.handleLogout = async function() {
            if (!confirm('Logout from your account?')) return;
            try {
                sessionStorage.removeItem('hask_logged_in');
                await signOut(auth);
                window.location.replace('login.html');
            } catch (err) {
                alert('Error: ' + err.message);
            }
        };

        function escapeHtml(str) {
            if (!str) return '';
            return String(str).replace(/[&<>"']/g, c => ({
                '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;'
            })[c]);
        }

        function timeAgo(dateStr) {
            if (!dateStr) return '-';
            const diff = Date.now() - new Date(dateStr).getTime();
            const days = Math.floor(diff / (1000 * 60 * 60 * 24));
            if (days < 1) return 'today';
            if (days === 1) return '1 day ago';
            if (days < 30) return days + ' days ago';
            return Math.floor(days / 30) + ' months ago';
        }
    </script>

</body>
</html>
