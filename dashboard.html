<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - HASK TalentConnect</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .user-header {
            background: white;
            padding: 25px 30px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
            margin-bottom: 22px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }

        .user-info-block {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .user-avatar {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: #1a2a6c;
            color: #f9c74f;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 1.4rem;
            flex-shrink: 0;
        }

        .user-name-title h2 {
            color: #1a2a6c;
            font-size: 1.25rem;
            margin-bottom: 3px;
        }

        .user-id-tag {
            display: inline-block;
            background: #e8f4fd;
            color: #0277bd;
            padding: 3px 10px;
            border-radius: 12px;
            font-size: 0.78rem;
            font-weight: 600;
            font-family: monospace;
            margin-right: 6px;
        }

        .role-tag {
            display: inline-block;
            background: #f9c74f;
            color: #1a2a6c;
            padding: 3px 10px;
            border-radius: 12px;
            font-size: 0.78rem;
            font-weight: 700;
        }

        .btn-logout-dash {
            background: #dc3545;
            color: white;
            padding: 10px 22px;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            font-family: inherit;
            font-size: 0.88rem;
            transition: 0.2s;
        }

        .btn-logout-dash:hover { background: #b02a37; }

        .stats-row-dash {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 14px;
            margin-bottom: 25px;
        }

        .stat-dash {
            background: white;
            padding: 22px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
            border-left: 4px solid #29b6f6;
        }

        .stat-dash .icon {
            font-size: 1.6rem;
            margin-bottom: 8px;
        }

        .stat-dash .num {
            font-size: 1.7rem;
            font-weight: bold;
            color: #1a2a6c;
        }

        .stat-dash .lbl {
            color: #666;
            font-size: 0.85rem;
            margin-top: 3px;
        }

        .section-head {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 25px 0 12px;
        }

        .section-head h3 {
            color: #1a2a6c;
            font-size: 1.15rem;
        }

        .section-head a {
            color: #29b6f6;
            font-size: 0.85rem;
            font-weight: 600;
        }

        .action-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 14px;
        }

        .action-card {
            background: white;
            padding: 22px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
            text-align: center;
            transition: 0.2s;
            cursor: pointer;
            border: 2px solid transparent;
            text-decoration: none;
            color: inherit;
            display: block;
        }

        .action-card:hover {
            border-color: #1a2a6c;
            transform: translateY(-3px);
        }

        .action-card .icon { font-size: 2rem; margin-bottom: 8px; }
        .action-card h4 { color: #1a2a6c; font-size: 1rem; margin-bottom: 5px; }
        .action-card p { color: #666; font-size: 0.82rem; }

        .apps-list { background: white; border-radius: 12px; overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
        .app-row {
            padding: 15px 20px;
            border-bottom: 1px solid #eef1f5;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }
        .app-row:last-child { border-bottom: none; }
        .app-row .app-title { color: #1a2a6c; font-weight: 600; font-size: 0.95rem; }
        .app-row .app-company { color: #666; font-size: 0.82rem; margin-top: 3px; }

        .status-tag {
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 0.75rem;
            font-weight: 600;
        }
        .status-pending { background: #fff3cd; color: #856404; }
        .status-reviewed { background: #d1ecf1; color: #0c5460; }
        .status-accepted { background: #d4edda; color: #155724; }
        .status-rejected { background: #f8d7da; color: #721c24; }

        .loading-screen {
            position: fixed; inset: 0;
            background: #1a2a6c; color: white;
            display: flex; flex-direction: column;
            justify-content: center; align-items: center;
            z-index: 9999; gap: 15px;
        }
    </style>
</head>

        <div class="section-head">
