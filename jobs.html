<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Browse Jobs - HASK TalentConnect</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Navbar -->
    <nav class="navbar">
        <div class="logo">HASK TalentConnect</div>
        <ul class="menu">
            <li><a href="index.html">Home</a></li>
            <li><a href="jobs.html">Browse Jobs</a></li>
            <li><a href="about.html">About</a></li>
            <li><a href="login.html" class="btn-primary">Login</a></li>
        </ul>
    </nav>

    <div class="container">

        <!-- Page Header -->
        <div class="page-header">
            <h1>Current Openings</h1>
            <p>See if you can find exciting challenges for your career</p>
        </div>

        <!-- Search Filters -->
        <div class="search-bar">
            <div class="search-filters">
                <select id="filterCompany">
                    <option value="">All Companies</option>
                </select>
                <select id="filterLocation">
                    <option value="">All Locations</option>
                    <option value="Sheikhupura">Sheikhupura</option>
                    <option value="Lahore">Lahore</option>
                    <option value="Karachi">Karachi</option>
                    <option value="Islamabad">Islamabad</option>
                    <option value="Rawalpindi">Rawalpindi</option>
                    <option value="Faisalabad">Faisalabad</option>
                    <option value="Multan">Multan</option>
                    <option value="Peshawar">Peshawar</option>
                    <option value="Gujranwala">Gujranwala</option>
                    <option value="Remote">Remote</option>
                </select>
                <select id="filterCategory">
                    <option value="">All Categories</option>
                    <option value="it">IT & Software</option>
                    <option value="sales">Sales & Marketing</option>
                    <option value="finance">Accounting & Finance</option>
                    <option value="hr">HR & Admin</option>
                    <option value="engineering">Engineering</option>
                    <option value="education">Education</option>
                    <option value="healthcare">Healthcare</option>
                    <option value="construction">Construction</option>
                    <option value="transport">Transport & Driver</option>
                    <option value="security">Security</option>
                    <option value="hospitality">Hospitality</option>
                    <option value="retail">Retail</option>
                    <option value="manufacturing">Manufacturing</option>
                    <option value="textile">Textile</option>
                    <option value="telecom">Telecom</option>
                    <option value="other">Other</option>
                </select>
                <button onclick="applyFilters()">Search</button>
            </div>
        </div>

        <!-- Jobs Table -->
        <div class="jobs-table-wrap">
            <table class="jobs-table">
                <thead>
                    <tr>
                        <th>Job-ID</th>
                        <th>Position Title</th>
                        <th>Employer</th>
                        <th>Category</th>
                        <th>Location</th>
                        <th>Posted</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody id="jobsBody">
                    <tr><td colspan="7" class="loading"><div class="spinner"></div></td></tr>
                </tbody>
            </table>
        </div>

    </div>

    <footer>
        <p>&copy; 2025 HASK TalentConnect. All rights reserved.</p>
    </footer>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
        import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAreIiCnSheAeXc2wNeU7-qFj-qFhaXZAo",
            authDomain: "hask-talentconnect.firebaseapp.com",
            projectId: "hask-talentconnect",
            storageBucket: "hask-talentconnect.firebasestorage.app",
            messagingSenderId: "532290737820",
            appId: "1:532290737820:web:49f70281b0f34837757f59"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        let allJobs = [];

        // ===== URL params =====
        const urlParams = new URLSearchParams(window.location.search);
        const initialQuery = urlParams.get('q') || '';
        const initialCat = urlParams.get('category') || '';
        const initialLoc = urlParams.get('location') || '';

        async function loadJobs() {
            try {
                const jobsSnap = await getDocs(collection(db, "jobs"));
                allJobs = [];
                jobsSnap.forEach(d => allJobs.push({ id: d.id, ...d.data() }));

                // Populate companies dropdown
                const companies = [...new Set(allJobs.map(j => j.company).filter(Boolean))].sort();
                const compSelect = document.getElementById('filterCompany');
                companies.forEach(c => {
                    const opt = document.createElement('option');
                    opt.value = c;
                    opt.textContent = c;
                    compSelect.appendChild(opt);
                });

                // Apply initial URL params
                if (initialCat) document.getElementById('filterCategory').value = initialCat;
                if (initialLoc) document.getElementById('filterLocation').value = initialLoc;

                renderJobs();
            } catch (err) {
                console.error(err);
                document.getElementById('jobsBody').innerHTML = `
                    <tr><td colspan="7" class="empty-state">
                        <span class="icon">⚠️</span>
                        <p>Error loading jobs</p>
                    </td></tr>
                `;
            }
        }

        function renderJobs() {
            const companyFilter = document.getElementById('filterCompany').value;
            const locFilter = document.getElementById('filterLocation').value;
            const catFilter = document.getElementById('filterCategory').value;

            let filtered = allJobs.filter(j => {
                const matchQ = !initialQuery ||
                    (j.title || '').toLowerCase().includes(initialQuery.toLowerCase()) ||
                    (j.company || '').toLowerCase().includes(initialQuery.toLowerCase());
                const matchCompany = !companyFilter || j.company === companyFilter;
                const matchLoc = !locFilter || j.location === locFilter;
                const matchCat = !catFilter || j.category === catFilter;
                return matchQ && matchCompany && matchLoc && matchCat;
            });

            // Sort newest first
            filtered.sort((a, b) => (b.createdAt || '').localeCompare(a.createdAt || ''));

            const tbody = document.getElementById('jobsBody');

            if (filtered.length === 0) {
                tbody.innerHTML = `
                    <tr><td colspan="7" class="empty-state">
                        <span class="icon">🔍</span>
                        <h3 style="color: #1a2a6c; margin-bottom: 8px;">No jobs found</h3>
                        <p>Try adjusting your filters or search terms</p>
                    </td></tr>
                `;
                return;
            }

            tbody.innerHTML = filtered.map(job => `
                <tr onclick="window.location.href='job-details.html?job=${job.id}'">
                    <td class="job-id">#${(job.jobId || job.id.slice(0,6)).toUpperCase()}</td>
                    <td class="job-title">
                        ${escapeHtml(job.title || 'Untitled')}
                        <small>Click for more information...</small>
                    </td>
                    <td class="company-cell">${escapeHtml(job.company || '-')}</td>
                    <td><span class="category-badge">${formatCat(job.category)}</span></td>
                    <td>${escapeHtml(job.location || 'Pakistan')}</td>
                    <td>${timeAgo(job.createdAt)}</td>
                    <td>
                        <button class="apply-btn" onclick="event.stopPropagation(); window.location.href='job-details.html?job=${job.id}'">
                            Apply
                        </button>
                    </td>
                </tr>
            `).join('');
        }

        function escapeHtml(str) {
            if (!str) return '';
            return String(str).replace(/[&<>"']/g, c => ({
                '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;'
            })[c]);
        }

        function formatCat(c) {
            if (!c) return 'Other';
            return c.split('-').map(w => w.charAt(0).toUpperCase() + w.slice(1)).join(' ');
        }

        function timeAgo(dateStr) {
            if (!dateStr) return '-';
            const diff = Date.now() - new Date(dateStr).getTime();
            const days = Math.floor(diff / (1000 * 60 * 60 * 24));
            if (days < 1) return 'Today';
            if (days === 1) return '1 day ago';
            if (days < 30) return `${days} days ago`;
            return `${Math.floor(days / 30)} months ago`;
        }

        window.applyFilters = function() {
            renderJobs();
        };

        ['filterCompany', 'filterLocation', 'filterCategory'].forEach(id => {
            document.getElementById(id).addEventListener('change', renderJobs);
        });

        loadJobs();
    </script>

</body>
</html>
