<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Our Team - HASK TalentConnect</title>
    <link rel="stylesheet" href="style.css">
    <style>
        html, body { height: 100%; }

        body {
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            margin: 0;
            font-family: 'Segoe UI', Arial, sans-serif;
            background: #f5f0e8;
            color: #222;
        }

        .page-wrapper {
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        /* ===== Navbar (same as index) ===== */
        .navbar {
            background: #1a2a6c;
            padding: 12px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        .navbar .logo {
            color: #f9c74f;
            font-size: 1.3rem;
            font-weight: bold;
        }

        .navbar .menu {
            display: flex;
            gap: 20px;
            align-items: center;
            list-style: none;
            margin: 0;
            padding: 0;
        }

        .navbar .menu a {
            color: white;
            font-size: 0.9rem;
            font-weight: 500;
            transition: 0.2s;
            text-decoration: none;
        }

        .navbar .menu a:hover { color: #f9c74f; }

        .navbar .btn-primary {
            background: #f9c74f;
            color: #1a2a6c !important;
            padding: 8px 22px;
            border-radius: 22px;
            font-weight: bold !important;
            font-size: 0.88rem;
        }

        .navbar .btn-primary:hover {
            background: #ffd166;
            transform: scale(1.04);
        }

        /* ===== Team Page ===== */
        .team-page {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 30px 20px 50px;
            overflow-x: hidden;
        }

        .team-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .team-header .small-tag {
            color: #888;
            font-size: 0.72rem;
            letter-spacing: 4px;
            font-weight: 600;
            text-transform: uppercase;
            margin-bottom: 12px;
        }

        .team-header h1 {
            font-size: 2.4rem;
            color: #1a1a1a;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        .carousel-wrap {
            position: relative;
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 640px;
            overflow: hidden;
            cursor: grab;
            user-select: none;
            padding: 20px 0;
        }

        .carousel-wrap:active { cursor: grabbing; }

        .carousel-track {
            position: relative;
            width: 100%;
            height: 620px;
            display: flex;
            align-items: center;
            justify-content: center;
            perspective: 1400px;
        }

        .member-card {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.65);
            width: 400px;
            height: 560px;
            border-radius: 24px;
            overflow: hidden;
            background: #2a2a2a;
            box-shadow: 0 20px 50px rgba(0,0,0,0.15);
            transition: all 0.6s cubic-bezier(0.25, 1, 0.5, 1);
            opacity: 0.55;
            pointer-events: none;
        }

        .member-card.active {
            transform: translate(-50%, -50%) scale(1);
            opacity: 1;
            z-index: 10;
            pointer-events: auto;
            box-shadow: 0 30px 80px rgba(0,0,0,0.35);
            cursor: pointer;
        }

        .member-card.active:hover {
            transform: translate(-50%, -50%) scale(1.02);
        }

        .member-card.prev {
            transform: translate(-125%, -50%) scale(0.72);
            opacity: 0.7;
            z-index: 5;
        }

        .member-card.next {
            transform: translate(25%, -50%) scale(0.72);
            opacity: 0.7;
            z-index: 5;
        }

        .member-card.far-prev {
            transform: translate(-190%, -50%) scale(0.55);
            opacity: 0;
            z-index: 1;
        }

        .member-card.far-next {
            transform: translate(90%, -50%) scale(0.55);
            opacity: 0;
            z-index: 1;
        }

        .member-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .member-card .card-info {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 30px 25px 25px;
            background: linear-gradient(to top, rgba(0,0,0,0.92), rgba(0,0,0,0.65) 60%, transparent);
            color: white;
        }

        .member-card .card-info h3 {
            font-size: 1.4rem;
            font-weight: 700;
            margin-bottom: 6px;
            letter-spacing: 0.2px;
            line-height: 1.2;
        }

        .member-card .card-info .role-line {
            font-size: 0.92rem;
            opacity: 0.92;
            font-weight: 500;
            margin-bottom: 10px;
        }

        .member-card .card-info .industry-line {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 0.82rem;
            color: #f9c74f;
            font-weight: 600;
            background: rgba(249, 199, 79, 0.15);
            padding: 5px 12px;
            border-radius: 20px;
            border: 1px solid rgba(249, 199, 79, 0.35);
            max-width: 100%;
        }

        .member-card .card-info .industry-line .ico { font-size: 0.9rem; }

        .linkedin-mini {
            position: absolute;
            top: 18px;
            right: 18px;
            width: 42px;
            height: 42px;
            background: rgba(0,0,0,0.7);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 1rem;
            font-weight: bold;
            opacity: 0;
            transition: 0.3s;
            backdrop-filter: blur(10px);
            z-index: 5;
        }

        .member-card.active .linkedin-mini { opacity: 1; }

        .click-hint {
            position: absolute;
            top: 18px;
            left: 18px;
            background: rgba(0,119,181,0.9);
            color: white;
            padding: 7px 14px;
            border-radius: 20px;
            font-size: 0.72rem;
            font-weight: 600;
            opacity: 0;
            transition: 0.3s;
            backdrop-filter: blur(10px);
            z-index: 5;
            pointer-events: none;
        }

        .member-card.active .click-hint { opacity: 0.95; }

        .carousel-nav {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 18px;
            margin-top: 25px;
        }

        .counter-text {
            color: #888;
            font-size: 0.85rem;
            font-weight: 600;
            letter-spacing: 3px;
        }

        .nav-controls {
            display: flex;
            align-items: center;
            gap: 22px;
        }

        .nav-btn {
            width: 52px;
            height: 52px;
            border-radius: 50%;
            border: 1.5px solid #1a1a1a;
            background: transparent;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: 0.25s;
            color: #1a1a1a;
            font-size: 1.2rem;
            font-family: inherit;
        }

        .nav-btn:hover {
            background: #1a1a1a;
            color: white;
            transform: scale(1.08);
        }

        .nav-btn.paused {
            background: #f9c74f;
            border-color: #f9c74f;
            color: #1a1a1a;
        }

        .progress-bar {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .progress-bar .bar {
            width: 40px;
            height: 3px;
            background: #ccc;
            border-radius: 2px;
            transition: 0.3s;
            cursor: pointer;
        }

        .progress-bar .bar.active {
            background: #1a1a1a;
            width: 60px;
        }

        .progress-bar .bar:hover { background: #999; }

        .drag-hint {
            color: #aaa;
            font-size: 0.7rem;
            letter-spacing: 3px;
            font-weight: 600;
            text-transform: uppercase;
            margin-top: 5px;
            text-align: center;
        }

        .timer-info {
            color: #888;
            font-size: 0.72rem;
            display: flex;
            align-items: center;
            gap: 6px;
            margin-top: -5px;
        }

        .timer-dot {
            width: 8px;
            height: 8px;
            background: #28a745;
            border-radius: 50%;
            animation: pulse 1.5s ease-in-out infinite;
        }

        .timer-dot.paused {
            background: #dc3545;
            animation: none;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.4; transform: scale(0.8); }
        }

        footer {
            background: #0f1a4a;
            color: white;
            text-align: center;
            padding: 22px 20px;
            margin-top: auto;
            flex-shrink: 0;
        }

        footer p { opacity: 0.75; font-size: 0.85rem; margin: 0; }

        @media (max-width: 900px) {
            .team-header h1 { font-size: 1.9rem; }
            .carousel-track { height: 540px; }
            .member-card { width: 340px; height: 480px; }
            .member-card .card-info h3 { font-size: 1.2rem; }
            .member-card .card-info .role-line { font-size: 0.85rem; }
            .member-card .card-info .industry-line { font-size: 0.75rem; }
        }

        @media (max-width: 600px) {
            .navbar { padding: 12px 15px; flex-direction: column; gap: 10px; }
            .navbar .menu { flex-wrap: wrap; justify-content: center; gap: 12px; }
            .team-page { padding: 20px 15px 40px; }
            .team-header h1 { font-size: 1.5rem; }
            .team-header .small-tag { font-size: 0.62rem; letter-spacing: 2px; }
            .carousel-wrap { min-height: 520px; }
            .carousel-track { height: 480px; }
            .member-card { width: 280px; height: 400px; border-radius: 18px; }
            .member-card .card-info { padding: 20px 16px 16px; }
            .member-card .card-info h3 { font-size: 1.05rem; }
            .member-card .card-info .role-line { font-size: 0.78rem; margin-bottom: 6px; }
            .member-card .card-info .industry-line { font-size: 0.68rem; padding: 4px 10px; }
            .nav-btn { width: 44px; height: 44px; font-size: 1rem; }
            .progress-bar .bar { width: 26px; }
            .progress-bar .bar.active { width: 40px; }
            .linkedin-mini { width: 36px; height: 36px; font-size: 0.85rem; }
            .click-hint { font-size: 0.65rem; padding: 5px 10px; }
        }
    </style>
</head>
<body>

    <div class="page-wrapper">

        <!-- Navbar (updated) -->
        <nav class="navbar">
            <div class="logo">HASK TalentConnect</div>
            <ul class="menu">
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="team.html">Team</a></li>
                <li><a href="login.html" class="btn-primary">Login</a></li>
            </ul>
        </nav>

        <!-- Team Section -->
        <div class="team-page">

            <div class="team-header">
                <div class="small-tag">HASK TALENTCONNECT · 10 MEMBERS</div>
                <h1>Our Core Team</h1>
            </div>

            <div class="carousel-wrap" id="carouselWrap">
                <div class="carousel-track" id="carouselTrack"></div>
            </div>

            <div class="carousel-nav">
                <div class="counter-text" id="counterText">01 / 10</div>

                <div class="nav-controls">
                    <button class="nav-btn" onclick="prevSlide()" aria-label="Previous">←</button>
                    <div class="progress-bar" id="progressBar"></div>
                    <button class="nav-btn" onclick="nextSlide()" aria-label="Next">→</button>
                </div>

                <div class="timer-info">
                    <span class="timer-dot" id="timerDot"></span>
                    <span id="timerText">Auto-rotating every 1.3s</span>
                    <button class="nav-btn paused" id="pauseBtn" onclick="toggleAutoRotate()" style="width: 28px; height: 28px; font-size: 0.75rem; margin-left: 5px;" title="Pause/Resume">⏸</button>
                </div>

                <div class="drag-hint">Drag · Scroll · Arrows</div>
            </div>

        </div>

    </div>

    <footer>
        <p>&copy; 2025 HASK TalentConnect. All rights reserved.</p>
    </footer>

    <script>
        const teamMembers = [
            { name: "Hafeez Ur Rehman", role: "Manager Admin & HR", industry: "National Feed Limited Sheikhupura", photo: "images/hafeez.jpg", linkedin: "https://www.linkedin.com/in/hafeez-ur-rehman-chrp-%C2%AE-7186a62b0/" },
            { name: "Shahrukh Irfan", role: "Senior Manager HR & Admin", industry: "Shahzad Textile Mills Ltd.", photo: "images/shahrukh.jpg", linkedin: "https://www.linkedin.com/in/shahrukh-irfan-5a527750/" },
            { name: "Humayun Akhtar", role: "Unit Head HR", industry: "National Bank of Pakistan", photo: "images/humayun.jpg", linkedin: "https://www.linkedin.com/in/humayunakhtar21/" },
            { name: "Muhammad Usman", role: "Assistant Manager HR", industry: "Millat Tractors Ltd.", photo: "images/usman.jpg", linkedin: "https://www.linkedin.com/in/muhammad-usman-chrp-93bb82113/" },
            { name: "Zeeshan Ali", role: "Deputy Manager HR", industry: "Clive Shoes", photo: "images/zeeshan.jpg", linkedin: "https://www.linkedin.com/in/zeeshan-ali-chrp/" },
            { name: "Ikram Hafeez Choudhry", role: "Team Lead HR", industry: "Fatima Fertilizer Limited", photo: "images/ikram.jpg", linkedin: "https://www.linkedin.com/in/ikraam-hafeez-495766191/" },
            { name: "Jehanzaib Abbas", role: "Assistant Manager HR", industry: "Nimir Chemicals Pakistan", photo: "images/jehanzaib.jpg", linkedin: "https://www.linkedin.com/in/jehanzaib-abbas-b39222139/" },
            { name: "Irfan Maqbool", role: "Dy. Manager Admin & HR", industry: "Balochistan Glass Limited", photo: "images/irfan.jpg", linkedin: "https://www.linkedin.com/in/irfan-maqbool-787b0a31/" },
            { name: "Muhammad Ahtisham", role: "Assistant Manager HR / IR", industry: "Anwer Rashid Industries", photo: "images/ahtisham.jpg", linkedin: "https://www.linkedin.com/in/malik-ahtisham-b55993242/" },
            { name: "Rida Zainab", role: "Executive Admin / HR", industry: "DreamBig Semiconductor Inc.", photo: "images/rida.jpg", linkedin: "#" }
        ];

        const formats = ['jpg', 'jpeg', 'png', 'webp', 'JPG', 'JPEG', 'PNG'];

        let currentIndex = 0;
        const total = teamMembers.length;

        const AUTO_ROTATE_MS = 1300;
        let autoRotateTimer = null;
        let isAutoRotating = true;
        let isHovering = false;

        function startAutoRotate() {
            stopAutoRotate();
            if (isHovering) return;
            autoRotateTimer = setInterval(() => {
                if (!isHovering) {
                    currentIndex = (currentIndex + 1) % total;
                    updateCarousel();
                }
            }, AUTO_ROTATE_MS);
        }

        function stopAutoRotate() {
            if (autoRotateTimer) {
                clearInterval(autoRotateTimer);
                autoRotateTimer = null;
            }
        }

        function toggleAutoRotate() {
            isAutoRotating = !isAutoRotating;
            const btn = document.getElementById('pauseBtn');
            const dot = document.getElementById('timerDot');
            const txt = document.getElementById('timerText');

            if (isAutoRotating) {
                startAutoRotate();
                btn.textContent = '⏸';
                btn.classList.add('paused');
                dot.classList.remove('paused');
                txt.textContent = 'Auto-rotating every 1.3s';
            } else {
                stopAutoRotate();
                btn.textContent = '▶';
                btn.classList.remove('paused');
                dot.classList.add('paused');
                txt.textContent = 'Auto-rotate paused';
            }
        }

        function buildCards() {
            const track = document.getElementById('carouselTrack');
            track.innerHTML = '';

            teamMembers.forEach((m, i) => {
                const card = document.createElement('div');
                card.className = 'member-card';
                card.dataset.index = i;

                const hasLinkedIn = m.linkedin && m.linkedin !== '#';

                card.innerHTML = `
                    <img data-photo="${m.photo}" data-name="${m.name}" alt="${m.name}">
                    ${hasLinkedIn ? `
                        <div class="click-hint">Click to view LinkedIn →</div>
                        <div class="linkedin-mini">in</div>
                    ` : ''}
                    <div class="card-info">
                        <h3>${m.name}</h3>
                        <p class="role-line">${m.role}</p>
                        <span class="industry-line">
                            <span class="ico">🏢</span>
                            <span>${m.industry}</span>
                        </span>
                    </div>
                `;

                card.addEventListener('click', () => {
                    if (i === currentIndex) {
                        if (hasLinkedIn) window.open(m.linkedin, '_blank');
                    } else {
                        goToSlide(i);
                    }
                });

                card.addEventListener('mouseenter', () => {
                    if (i === currentIndex) {
                        isHovering = true;
                        stopAutoRotate();
                    }
                });

                card.addEventListener('mouseleave', () => {
                    if (i === currentIndex) {
                        isHovering = false;
                        if (isAutoRotating) startAutoRotate();
                    }
                });

                track.appendChild(card);
            });

            document.querySelectorAll('.member-card img').forEach(img => {
                const photoBase = img.getAttribute('data-photo').replace(/\.[^.]+$/, '');
                const name = img.getAttribute('data-name');
                let fmtIndex = 0;

                function tryNext() {
                    if (fmtIndex >= formats.length) {
                        img.src = 'https://ui-avatars.com/api/?name=' + encodeURIComponent(name) + '&background=333&color=fff&size=600';
                        return;
                    }
                    const testUrl = photoBase + '.' + formats[fmtIndex];
                    const tester = new Image();
                    tester.onload = () => { img.src = testUrl; };
                    tester.onerror = () => { fmtIndex++; tryNext(); };
                    tester.src = testUrl;
                }
                tryNext();
            });

            const pb = document.getElementById('progressBar');
            pb.innerHTML = '';
            for (let i = 0; i < total; i++) {
                const bar = document.createElement('div');
                bar.className = 'bar';
                bar.addEventListener('click', () => goToSlide(i));
                pb.appendChild(bar);
            }

            updateCarousel();
        }

        function updateCarousel() {
            const cards = document.querySelectorAll('.member-card');

            cards.forEach((card, i) => {
                card.classList.remove('active', 'prev', 'next', 'far-prev', 'far-next');

                if (i === currentIndex) card.classList.add('active');
                else if (i === currentIndex - 1 || (currentIndex === 0 && i === total - 1)) card.classList.add('prev');
                else if (i === currentIndex + 1 || (currentIndex === total - 1 && i === 0)) card.classList.add('next');
                else if (i < currentIndex - 1) card.classList.add('far-prev');
                else card.classList.add('far-next');
            });

            document.getElementById('counterText').textContent =
                String(currentIndex + 1).padStart(2, '0') + ' / ' + String(total).padStart(2, '0');

            document.querySelectorAll('.progress-bar .bar').forEach((bar, i) => {
                bar.classList.toggle('active', i === currentIndex);
            });
        }

        function nextSlide() {
            currentIndex = (currentIndex + 1) % total;
            updateCarousel();
            if (isAutoRotating && !isHovering) startAutoRotate();
        }

        function prevSlide() {
            currentIndex = (currentIndex - 1 + total) % total;
            updateCarousel();
            if (isAutoRotating && !isHovering) startAutoRotate();
        }

        function goToSlide(i) {
            currentIndex = i;
            updateCarousel();
            if (isAutoRotating && !isHovering) startAutoRotate();
        }

        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowRight') nextSlide();
            if (e.key === 'ArrowLeft') prevSlide();
        });

        const wrap = document.getElementById('carouselWrap');
        let startX = 0, isDown = false;

        wrap.addEventListener('mousedown', (e) => { isDown = true; startX = e.clientX; });
        wrap.addEventListener('mouseup', (e) => {
            if (!isDown) return;
            isDown = false;
            const dx = e.clientX - startX;
            if (dx < -50) nextSlide();
            else if (dx > 50) prevSlide();
        });
        wrap.addEventListener('mouseleave', () => { isDown = false; });

        wrap.addEventListener('touchstart', (e) => { startX = e.touches[0].clientX; }, { passive: true });
        wrap.addEventListener('touchend', (e) => {
            const dx = e.changedTouches[0].clientX - startX;
            if (dx < -50) nextSlide();
            else if (dx > 50) prevSlide();
        });

        let wheelLock = false;
        wrap.addEventListener('wheel', (e) => {
            if (wheelLock) return;
            if (Math.abs(e.deltaX) > 30 || Math.abs(e.deltaY) > 30) {
                wheelLock = true;
                if (e.deltaX > 30 || e.deltaY > 30) nextSlide();
                else prevSlide();
                setTimeout(() => { wheelLock = false; }, 600);
            }
        }, { passive: true });

        document.addEventListener('visibilitychange', () => {
            if (document.hidden) stopAutoRotate();
            else if (isAutoRotating && !isHovering) startAutoRotate();
        });

        buildCards();
        startAutoRotate();
    </script>

</body>
</html>
